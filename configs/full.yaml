dataset:
  root_path: data/public/input

agent:
  model: qwen3.5-35b-a3b
  api_base: http://127.0.0.1:8000/v1
  api_key: "inspectai"
  api_key_env: QwenAPI
  max_steps: 600
  temperature: 0.0
  enable_data_inspector: true
  enable_answer_validator: true
  enable_question_analysis: true
  strip_reasoning_history: false
  reasoning_history_limit: 5
  prompt_version: 1
  model_request_timeout_seconds: 200

data_inspector:
  sample_budget:
    catalog_top_distinct_values: 30
    max_doc_chars: 4000

tool:
  max_output_chars: 30000
  max_list_items: 200

run:
  output_dir: artifacts/runs
  run_id:
  max_workers: 8
  task_timeout_seconds: 1200

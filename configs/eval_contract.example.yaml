dataset:
  root_path: data/public/input

agent:
  model: YOUR_MODEL_NAME
  api_base: YOUR_API_BASE_URL
  api_key: ""
  api_key_env: YOUR_API_KEY_NAME
  max_steps: 32
  temperature: 0.0
  enable_thinking: false
  enable_data_inspector: true

data_inspector:
  mode: hybrid
  inject_summary_to_agent: true
  max_agent_steps: 3
  enable_semantic_tools: true
  context_bundle_limit: 5
  max_join_hops: 3
  sample_budget:
    catalog_sample_rows: 5
    max_doc_chars: 2000
    max_json_chars: 4000

run:
  output_dir: artifacts/runs
  run_id:
  max_workers: 4
  task_timeout_seconds: 600
  soft_runtime_limit_seconds: 42300
  task_ids:
    - task_25
    - task_80
    - task_89
    - task_163
    - task_180
    - task_379

dataset:
  root_path: data/public/input

agent:
  model: qwen3.5-35b-a3b
  api_base: http://127.0.0.1:8000/v1
  api_key: "inspectai"
  api_key_env: QwenAPI
  max_steps: 100
  temperature: 0.0
  enable_data_inspector: true
  model_request_timeout_seconds: 240

data_inspector:
  sample_budget:
    catalog_top_distinct_values: 50
    max_doc_chars: 2000

run:
  output_dir: artifacts/runs
  run_id:
  max_workers: 8
  task_timeout_seconds: 1200
  task_ids:
    - task_173
    - task_169
    - task_199

dataset:
  root_path: /input

agent:
  model_env: MODEL_NAME
  api_base_env: MODEL_API_URL
  api_key_env: MODEL_API_KEY
  max_steps: 48
  temperature: 0.0
  enable_thinking: false
  enable_data_inspector: true

data_inspector:
  mode: hybrid
  inject_summary_to_agent: true
  max_agent_steps: 15
  max_phase_retries: 1
  enable_semantic_tools: true
  include_inspector_trace: true
  context_bundle_limit: 6
  max_join_hops: 3
  sample_budget:
    catalog_sample_rows: 6
    max_doc_chars: 2000
    max_json_chars: 4000

run:
  output_dir: /output
  log_dir: /logs
  output_layout: flat
  run_id:
  max_workers: 4
  task_timeout_seconds: 600
  soft_runtime_limit_seconds: 42300

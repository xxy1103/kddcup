dataset:
  root_path: /input

agent:
  model_env: MODEL_NAME
  api_base_env: MODEL_API_URL
  api_key_env: MODEL_API_KEY
  max_steps: 600
  temperature: 0.0
  enable_data_inspector: true
  enable_answer_validator: true
  enable_question_analysis: true
  strip_reasoning_history: false
  reasoning_history_limit: 
  prompt_version: 1
  model_request_timeout_seconds: 200

data_inspector:
  sample_budget:
    catalog_top_distinct_values: 30
    max_doc_chars: 4000

tool:
  max_output_chars: 30000
  max_list_items: 200

run:
  output_dir: /output
  log_dir: /logs
  output_layout: flat
  run_id:
  max_workers: 8
  task_timeout_seconds: 1200

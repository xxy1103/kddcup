dataset:
  root_path: /input

agent:
  model_env: MODEL_NAME
  api_base_env: MODEL_API_URL
  api_key_env: MODEL_API_KEY
  max_steps: 600
  temperature: 0.0
  enable_data_inspector: true
  model_request_timeout_seconds: 300

data_inspector:
  enable_global_exploration_llm: true
  enable_problem_grounding: true
  inject_summary_to_agent: true
  max_agent_steps: 15
  max_phase_retries: 1
  enable_semantic_tools: true
  include_inspector_trace: true
  context_bundle_limit: 6
  profile_guided_fast_path: true
  sample_budget:
    catalog_top_distinct_values: 50
    max_doc_chars: 2000

run:
  output_dir: /output
  log_dir: /logs
  output_layout: flat
  run_id:
  max_workers: 8
  task_timeout_seconds: 2400

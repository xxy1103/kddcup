dataset:
  root_path: /input

agent:
  model_env: MODEL_NAME
  api_base_env: MODEL_API_URL
  api_key_env: MODEL_API_KEY
  max_steps: 64
  temperature: 0.2
  model_request_timeout_seconds: 1800
  max_tokens: 8192
  enable_data_inspector: true
  enable_answer_validator: true
  enable_process_validator: true
  enable_ambiguity_analysis: false
  strip_reasoning_history: false
  reasoning_history_limit: 10
  prompt_version: 1
  compress_used_image_messages: true
  compressed_image_note_chars: 600


data_inspector:
  sample_budget:
    catalog_top_distinct_values: 5
    max_doc_tokens: 1000

video_preprocessing:
  enabled: true
  sample_fps: 2.0
  diff_threshold: 0.025
  pixel_delta: 25
  min_stable_duration: 1.0
  resize_width: 320
  dedup: true
  hash_threshold: 4
  jpg_quality: 95
  max_attached_frames: 16
  asr_model: base
  asr_device: cpu
  asr_compute_type: int8

process_validator:
  checkpoint_model_interval: 10
  retry_limit: 1
  recent_step_limit: 10

tool:
  max_output_tokens: 10000
  max_list_items: 200

run:
  output_dir: /output
  log_dir: /logs
  output_layout: flat
  run_id:
  max_workers: 4
  task_timeout_seconds: 2400
